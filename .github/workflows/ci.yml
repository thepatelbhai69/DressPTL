name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — the root package.json sets
      # packageManager, and specifying both makes this action hard-fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next build
        run: pnpm --filter @dressptl/web build

      # Builds the artefact that actually gets deployed. Catches adapter and
      # runtime-compatibility breakage that `next build` alone does not.
      - name: OpenNext build
        run: pnpm --filter @dressptl/web exec opennextjs-cloudflare build

      # The whole architecture rests on no credential reaching the client, so
      # this is a gate rather than a lint.
      - name: Scan build output for leaked secrets
        run: pnpm check:no-secrets

      # Catches the class of mistake that broke the first deploy: a workflow
      # that is valid YAML but wrong as an Actions config.
      - name: Lint workflows
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
