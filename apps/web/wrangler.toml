name = "dressptl-web"
main = ".open-next/worker.js"
compatibility_date = "2026-06-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dressptl"
database_id = "4105c84b-5cf8-4361-81b8-d6e8f2a1e349"
migrations_dir = "migrations"

# Requires R2 to be enabled once on the account (Dashboard > R2), then:
#   wrangler r2 bucket create dressptl-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "dressptl-photos"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2a71eb53a6354eafa214c71c6e21368a"

# Inference lives entirely behind this binding. The web app has no AI binding
# and no model credentials of its own.
[[services]]
binding = "MISTRAL_PROXY"
service = "dressptl-mistral-proxy"

# Secret — set with `wrangler secret put PROXY_SHARED_SECRET` (same value as
# the one configured on dressptl-mistral-proxy).
